name: Portable CPU and CUDA build

"on":
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libcurl4-openssl-dev
      - name: Diagnose
        run: python3 scripts/dev.py doctor --backend cpu --json > doctor-linux-cpu.json
      - name: Build and verify
        run: python3 scripts/dev.py verify --backend cpu --build-type Release --jobs 2
      - name: Inspect VNNI code generation
        run: BUILD_DIR=out/linux-cpu-release bash ./scripts/cpu_vnni_check.sh
      - name: Verify no CUDA dependency
        run: |
          if ldd out/linux-cpu-release/libceleg_cpu.so | grep -Ei 'cuda|cublas'; then
            echo 'CPU ABI unexpectedly links CUDA' >&2
            exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-linux-cpu
          path: doctor-linux-cpu.json
          if-no-files-found: ignore

  linux-cuda:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    env:
      CC: /usr/bin/gcc-12
      CXX: /usr/bin/g++-12
      CUDAHOSTCXX: /usr/bin/g++-12
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-12 g++-12 python3 python3-pip libcurl4-openssl-dev
          python3 -m pip install --no-cache-dir cmake==3.31.6 ninja==1.13.0
      - name: Diagnose
        run: python3 scripts/dev.py doctor --backend cuda --arch 80 --json > doctor-linux-cuda.json
      - name: Compile and run host tests
        shell: bash
        run: |
          set +e
          python3 scripts/dev.py verify --backend cuda --arch 80 --celeg-tests off --build-type Release --jobs 2 > verify-linux-cuda.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> verify-linux-cuda.log
          exit "$code"
      - name: Upload CUDA compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-linux-cuda
          path: verify-linux-cuda.log
          if-no-files-found: ignore
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-linux-cuda
          path: doctor-linux-cuda.json
          if-no-files-found: ignore

  windows-cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ninja
        run: python -m pip install ninja
      - name: Diagnose
        run: python scripts/dev.py doctor --backend cpu --json > doctor-windows-cpu.json
      - name: Build and verify
        run: python scripts/dev.py verify --backend cpu --build-type Release --jobs 2
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-windows-cpu
          path: doctor-windows-cpu.json
          if-no-files-found: ignore

  windows-cuda:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.32
        with:
          cuda: "12.8.1"
          method: network
      - name: Install Ninja
        run: python -m pip install ninja
      - name: Diagnose
        run: python scripts/dev.py doctor --backend cuda --arch 80 --json > doctor-windows-cuda.json
      - name: Compile with MSVC and NVCC
        run: python scripts/dev.py build --backend cuda --arch 80 --celeg-tests off --build-type Release --jobs 2
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-windows-cuda
          path: doctor-windows-cuda.json
          if-no-files-found: ignore