name: Patch packed runtime test registration

"on":
  push:
    branches:
      - refactor-clean-semantics-final
    paths:
      - .github/workflows/patch-packed-runtime-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate driver-dependent packed test
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('CMakeLists.txt'); s=p.read_text(); old='        add_test(NAME packed_commit_test COMMAND packed_commit_test)'; new='        if(CELEG_RUN_CUDA_TESTS)\\n            add_test(NAME packed_commit_test COMMAND packed_commit_test)\\n        endif()'; assert s.count(old) == 1; p.write_text(s.replace(old, new))"
          rm .github/workflows/patch-packed-runtime-test.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: gate packed commit runtime test"
          git push origin HEAD:refactor-clean-semantics-final
