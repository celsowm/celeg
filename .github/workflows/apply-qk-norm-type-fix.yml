name: Apply QK norm semantic fix

"on":
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/apply-qk-norm-type-fix.yml"
      - ".github/scripts/apply_qk_norm_semantic_fix.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply semantic source fix
        run: python .github/scripts/apply_qk_norm_semantic_fix.py
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/model/inference/metadata.cpp CMakeLists.txt; then
            echo "No source changes to commit"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/model/inference/metadata.cpp CMakeLists.txt
          git commit -m "model: enforce qk norm type semantics"
          git push origin HEAD:master
