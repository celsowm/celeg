name: Apply QK norm semantic fix

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-qk-norm-type-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch QK norm semantic handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          metadata_path = Path("src/model/inference/metadata.cpp")
          text = metadata_path.read_text(encoding="utf-8")

          old_known = '''        "qk_norm", "query_key_norm", "use_qk_norm", "xsa_projection",'''
          new_known = '''        "qk_norm", "query_key_norm", "use_qk_norm", "qk_norm_type", "xsa_projection",'''
          if text.count(old_known) != 1:
              raise SystemExit("unexpected qk semantic allowlist shape")
          text = text.replace(old_known, new_known)

          old_assignment = '''    result.attention.query_key_norm = aliases<bool>(
        metadata, {"qk_norm", "query_key_norm", "use_qk_norm"}, result.evidence,
        "query_key_norm");
'''
          new_assignment = '''    result.attention.query_key_norm = aliases<bool>(
        metadata, {"qk_norm", "query_key_norm", "use_qk_norm"}, result.evidence,
        "query_key_norm");
    if (result.attention.query_key_norm.value_or(false)) {
        std::optional<std::string> qk_norm_type;
        std::string qk_norm_type_source;
        for (const std::string_view key : {
                 std::string_view("qk_norm_type"),
                 std::string_view("text_config.qk_norm_type")}) {
            if (!metadata.contains(key)) continue;
            const MetadataValue& raw = metadata.value(key);
            const auto* value = std::get_if<std::string>(&raw);
            if (value == nullptr) {
                inference_detail::fail(
                    ResolutionFailureKind::ConflictingMetadata,
                    "Q/K normalization type metadata is not a string: " +
                        std::string(key));
            }
            if (qk_norm_type.has_value() && *qk_norm_type != *value) {
                inference_detail::fail(
                    ResolutionFailureKind::ConflictingMetadata,
                    "conflicting Q/K normalization type metadata");
            }
            qk_norm_type = *value;
            qk_norm_type_source = std::string(key);
        }
        if (qk_norm_type.has_value()) {
            if (*qk_norm_type != "rmsnorm") {
                inference_detail::fail(
                    ResolutionFailureKind::UnsupportedSemanticFeature,
                    "unsupported Q/K normalization mathematics: " + *qk_norm_type);
            }
            result.evidence.push_back({EvidenceKind::ExplicitMetadata,
                                       qk_norm_type_source,
                                       "query_key_norm = rmsnorm"});
        }
    }
'''
          if text.count(old_assignment) != 1:
              raise SystemExit("unexpected query_key_norm assignment shape")
          text = text.replace(old_assignment, new_assignment)
          metadata_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/checkpoint_capabilities_test.cpp")
          test = test_path.read_text(encoding="utf-8")
          include_old = '#include "celeg/checkpoint/metadata.hpp"\n'
          include_new = '#include "celeg/checkpoint/metadata.hpp"\n#include "celeg/model/inference.hpp"\n'
          if test.count(include_old) != 1:
              raise SystemExit("unexpected checkpoint test include shape")
          test = test.replace(include_old, include_new)

          tail_old = '''    CELEG_TEST_CHECK(flags[0] == 1);
    CELEG_TEST_CHECK(flags[1] == 0);
    CELEG_TEST_CHECK(flags[2] == 1);
    return 0;
}
'''
          tail_new = '''    CELEG_TEST_CHECK(flags[0] == 1);
    CELEG_TEST_CHECK(flags[1] == 0);
    CELEG_TEST_CHECK(flags[2] == 1);

    const auto rms_qk_metadata = celeg::CheckpointMetadata::from_json(
        celeg::Json::parse(
            R"({"rope_theta":10000,"use_qk_norm":true,"qk_norm_type":"rmsnorm"})"));
    const auto rms_qk = celeg::normalize_model_metadata(rms_qk_metadata);
    CELEG_TEST_CHECK(rms_qk.attention.query_key_norm.value_or(false));

    bool rejected_qk_math = false;
    try {
        const auto unsupported_qk_metadata = celeg::CheckpointMetadata::from_json(
            celeg::Json::parse(
                R"({"rope_theta":10000,"use_qk_norm":true,"qk_norm_type":"layernorm"})"));
        (void)celeg::normalize_model_metadata(unsupported_qk_metadata);
    } catch (const celeg::ResolutionError& error) {
        rejected_qk_math =
            error.kind() == celeg::ResolutionFailureKind::UnsupportedSemanticFeature;
    }
    CELEG_TEST_CHECK(rejected_qk_math);
    return 0;
}
'''
          if test.count(tail_old) != 1:
              raise SystemExit("unexpected checkpoint test tail shape")
          test = test.replace(tail_old, tail_new)
          test_path.write_text(test, encoding="utf-8")
          PY

      - name: Commit generic semantic fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/model/inference/metadata.cpp tests/checkpoint_capabilities_test.cpp
          git diff --cached --check
          git commit -m "model: validate declared qk norm mathematics"
          git push origin HEAD:master
