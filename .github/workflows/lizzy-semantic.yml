name: Lizzy Transformers semantic oracle

"on":
  push:
    branches:
      - master
    paths:
      - ".github/workflows/lizzy-semantic.yml"
      - "benchmarks/inspect_safetensors.py"
      - "benchmarks/materialize_sparse_safetensors.py"
      - "benchmarks/compare_transformers.py"
      - "src/model/**"
      - "src/checkpoint/**"
      - "src/app/**"
  workflow_dispatch:
    inputs:
      run_semantic:
        description: Run the full CELEG vs Transformers comparison on a GPU runner
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: lizzy-semantic-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_REPO: flwrlabs/Lizzy-7B
  HF_REVISION: 830c14022d19d80e3b09a6a3264dc0fd33a55f23

jobs:
  apply-qk-semantic-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply generic QK norm semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          metadata_path = Path("src/model/inference/metadata.cpp")
          text = metadata_path.read_text(encoding="utf-8")
          changed = False

          old_known = '        "qk_norm", "query_key_norm", "use_qk_norm", "xsa_projection",'
          new_known = '        "qk_norm", "query_key_norm", "use_qk_norm", "qk_norm_type", "xsa_projection",'
          if old_known in text:
              if text.count(old_known) != 1:
                  raise SystemExit("unexpected qk semantic allowlist shape")
              text = text.replace(old_known, new_known)
              changed = True

          old_assignment = '''    result.attention.query_key_norm = aliases<bool>(
              metadata, {"qk_norm", "query_key_norm", "use_qk_norm"}, result.evidence,
              "query_key_norm");
          '''
          new_assignment = '''    result.attention.query_key_norm = aliases<bool>(
              metadata, {"qk_norm", "query_key_norm", "use_qk_norm"}, result.evidence,
              "query_key_norm");
              if (result.attention.query_key_norm.value_or(false)) {
                  std::optional<std::string> qk_norm_type;
                  std::string qk_norm_type_source;
                  for (const std::string_view key : {
                           std::string_view("qk_norm_type"),
                           std::string_view("text_config.qk_norm_type")}) {
                      if (!metadata.contains(key)) continue;
                      const MetadataValue& raw = metadata.value(key);
                      const auto* value = std::get_if<std::string>(&raw);
                      if (value == nullptr) {
                          inference_detail::fail(
                              ResolutionFailureKind::ConflictingMetadata,
                              "Q/K normalization type metadata is not a string: " +
                                  std::string(key));
                      }
                      if (qk_norm_type.has_value() && *qk_norm_type != *value) {
                          inference_detail::fail(
                              ResolutionFailureKind::ConflictingMetadata,
                              "conflicting Q/K normalization type metadata");
                      }
                      qk_norm_type = *value;
                      qk_norm_type_source = std::string(key);
                  }
                  if (qk_norm_type.has_value()) {
                      if (*qk_norm_type != "rmsnorm") {
                          inference_detail::fail(
                              ResolutionFailureKind::UnsupportedSemanticFeature,
                              "unsupported Q/K normalization mathematics: " + *qk_norm_type);
                      }
                      result.evidence.push_back({EvidenceKind::ExplicitMetadata,
                                                 qk_norm_type_source,
                                                 "query_key_norm = rmsnorm"});
                  }
              }
          '''
          if old_assignment in text:
              if text.count(old_assignment) != 1:
                  raise SystemExit("unexpected query_key_norm assignment shape")
              text = text.replace(old_assignment, new_assignment)
              changed = True

          if changed:
              metadata_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/checkpoint_capabilities_test.cpp")
          test = test_path.read_text(encoding="utf-8")
          test_changed = False
          include_old = '#include "celeg/checkpoint/metadata.hpp"\n'
          include_new = '#include "celeg/checkpoint/metadata.hpp"\n#include "celeg/model/inference.hpp"\n'
          if '#include "celeg/model/inference.hpp"' not in test:
              if test.count(include_old) != 1:
                  raise SystemExit("unexpected checkpoint test include shape")
              test = test.replace(include_old, include_new)
              test_changed = True

          marker = '''    CELEG_TEST_CHECK(flags[2] == 1);
          '''
          addition = '''    CELEG_TEST_CHECK(flags[2] == 1);

              const auto rms_qk_metadata = celeg::CheckpointMetadata::from_json(
                  celeg::Json::parse(
                      R"({"rope_theta":10000,"use_qk_norm":true,"qk_norm_type":"rmsnorm"})"));
              const auto rms_qk = celeg::normalize_model_metadata(rms_qk_metadata);
              CELEG_TEST_CHECK(rms_qk.attention.query_key_norm.value_or(false));

              bool rejected_qk_math = false;
              try {
                  const auto unsupported_qk_metadata = celeg::CheckpointMetadata::from_json(
                      celeg::Json::parse(
                          R"({"rope_theta":10000,"use_qk_norm":true,"qk_norm_type":"layernorm"})"));
                  (void)celeg::normalize_model_metadata(unsupported_qk_metadata);
              } catch (const celeg::ResolutionError& error) {
                  rejected_qk_math =
                      error.kind() == celeg::ResolutionFailureKind::UnsupportedSemanticFeature;
              }
              CELEG_TEST_CHECK(rejected_qk_math);
          '''
          if 'rejected_qk_math' not in test:
              if test.count(marker) != 1:
                  raise SystemExit("unexpected checkpoint test marker shape")
              test = test.replace(marker, addition)
              test_changed = True
          if test_changed:
              test_path.write_text(test, encoding="utf-8")

          if not changed and not test_changed:
              print("QK norm semantic fix already present")
          PY

          if git diff --quiet -- src/model/inference/metadata.cpp tests/checkpoint_capabilities_test.cpp; then
            echo "No source changes to commit"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/model/inference/metadata.cpp tests/checkpoint_capabilities_test.cpp
          git commit -m "model: validate declared qk norm mathematics"
          git push origin HEAD:master

  hf-auth:
    needs: apply-qk-semantic-fix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hugging Face client
        run: python -m pip install --disable-pip-version-check --no-cache-dir huggingface_hub
      - name: Verify Hugging Face credential and repository access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download, whoami

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("HF_TOKEN GitHub Actions secret is missing")
          identity = whoami(token=token)
          print(f"Hugging Face authentication: {identity['name']}")
          path = hf_hub_download(
              repo_id=os.environ["HF_REPO"],
              filename="config.json",
              revision=os.environ["HF_REVISION"],
              token=token,
          )
          print(f"Lizzy config access: {path}")
          PY

  inspect-checkpoint:
    needs: hf-auth
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libcurl4-openssl-dev
          python -m pip install --disable-pip-version-check --no-cache-dir huggingface_hub
      - name: Inspect real Lizzy safetensors metadata
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/inspect_safetensors.py \
            --model "$HF_REPO" \
            --revision "$HF_REVISION" \
            --json-out lizzy-tensors.json \
            2>&1 | tee lizzy-tensors.log
      - name: Materialize metadata-only sparse checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/materialize_sparse_safetensors.py \
            --model "$HF_REPO" \
            --revision "$HF_REVISION" \
            --output lizzy-sparse \
            2>&1 | tee lizzy-sparse.log
          du -h lizzy-sparse/model.safetensors
          ls -lh lizzy-sparse/model.safetensors
      - name: Build CELEG CPU resolver
        run: python scripts/dev.py build --backend cpu --build-type Release --jobs 2
      - name: Resolve real Lizzy config and tensor grammar in CELEG
        shell: bash
        run: |
          set -euo pipefail
          out/linux-cpu-release/celeg-cpu-run \
            --model lizzy-sparse \
            --print-config \
            --context 512 \
            2>&1 | tee lizzy-celeg-resolution.log
      - name: Upload checkpoint metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lizzy-checkpoint-metadata
          path: |
            lizzy-tensors.json
            lizzy-tensors.log
            lizzy-sparse.log
            lizzy-celeg-resolution.log
          if-no-files-found: ignore

  semantic-oracle:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_semantic }}
    needs:
      - hf-auth
      - inspect-checkpoint
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose GPU
        run: nvidia-smi
      - name: Install Python oracle dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade torch transformers accelerate huggingface_hub safetensors
      - name: Verify Hugging Face credential
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import whoami

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("HF_TOKEN GitHub Actions secret is missing")
          identity = whoami(token=token)
          print(f"Hugging Face authentication: {identity['name']}")
          PY
      - name: Download pinned real Lizzy checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          path = snapshot_download(
              repo_id=os.environ["HF_REPO"],
              revision=os.environ["HF_REVISION"],
              token=os.environ["HF_TOKEN"],
          )
          print(f"Lizzy snapshot: {path}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"LIZZY_MODEL_DIR={path}\n")
          PY
      - name: Build CELEG CUDA
        run: python scripts/dev.py build --backend cuda --build-type Release --jobs 4
      - name: Compare CELEG with Transformers
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/compare_transformers.py \
            --model "$LIZZY_MODEL_DIR" \
            --celeg-run out/linux-cuda-release/celeg-run \
            --context 512 \
            --max-new-tokens 16 \
            2>&1 | tee lizzy-semantic.log
      - name: Upload semantic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lizzy-semantic-log
          path: lizzy-semantic.log
          if-no-files-found: ignore
