name: Inspect missed semantic assertions

"on":
  push:
    branches:
      - refactor-clean-semantics

jobs:
  inspect:
    if: "github.event.head_commit.message == 'chore: inspect missed semantic assertions'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eed8ee6b41448107332d5628dce7f3b29f5e667d
      - name: Show exact remaining legacy assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -n -B 6 -A 6 -E 'routing_group_count|shared_intermediate_size' tests/automatic_inference_test.cpp
