name: Fix semantic assertions

"on":
  push:
    branches:
      - refactor-clean-semantics

permissions:
  contents: write

jobs:
  fix:
    if: "github.event.head_commit.message == 'chore: fix missed semantic assertions'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: eed8ee6b41448107332d5628dce7f3b29f5e667d
      - name: Migrate remaining assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/automatic_inference_test.cpp')
          text = path.read_text()

          grouped = re.compile(
              r'(std::get<celeg::MixtureOfExpertsSpec>\(\s*[^;]*?\.feed_forward\s*\))\s*\.routing_group_count',
              re.S)
          shared = re.compile(
              r'(std::get<celeg::MixtureOfExpertsSpec>\(\s*[^;]*?\.feed_forward\s*\))\s*\.shared_intermediate_size',
              re.S)

          grouped_matches = list(grouped.finditer(text))
          shared_matches = list(shared.finditer(text))
          assert len(grouped_matches) == 1, len(grouped_matches)
          assert len(shared_matches) == 1, len(shared_matches)

          text = grouped.sub(
              lambda m: 'std::get<celeg::MoeGroupedTopKSelectionSpec>(' +
                        m.group(1) + '.selection).group_count',
              text)
          text = shared.sub(
              lambda m: m.group(1) + '.shared->intermediate_size',
              text)
          path.write_text(text)
          PY
          grep -n -B 4 -A 4 -E 'MoeGroupedTopKSelectionSpec|shared->intermediate_size' tests/automatic_inference_test.cpp
          if git grep -n -E '\.(routing_group_count|shared_intermediate_size)\b' -- '*.cpp' '*.hpp'; then
            echo 'deleted MoE member still consumed' >&2
            exit 1
          fi
          python3 scripts/check_architecture_boundaries.py
          git diff --check
      - name: Build and verify CPU
        run: python3 scripts/dev.py verify --backend cpu --build-type Release --jobs 2
      - name: Publish fixed candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "celsowm"
          git config user.email "celsowm@gmail.com"
          git add tests/automatic_inference_test.cpp
          git commit -m "test: migrate remaining MoE semantic assertions"
          git push --force origin HEAD:refactor-clean-semantics
