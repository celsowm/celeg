name: Finalize refactor references

"on":
  push:
    branches:
      - refactor-clean-semantics-final
    paths:
      - .github/workflows/finalize-refactor.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh renamed source references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          dispatcher = Path('src/backend/cuda/runtime/gemm_dispatcher.cpp')
          digest = hashlib.sha256(dispatcher.read_bytes()).hexdigest()

          manifest = Path('MANIFEST.sha256')
          text = manifest.read_text()
          old = 'a98ea0d03745881a23a4c7aa1a9fa3347ad7279eb7ddab63548c1880c4d20727  ./src/backend/cuda/runtime/gemm_dispatcher.cu'
          new = f'{digest}  ./src/backend/cuda/runtime/gemm_dispatcher.cpp'
          if old not in text:
              raise SystemExit('expected stale manifest entry not found')
          manifest.write_text(text.replace(old, new))

          evidence = Path('docs/ARCHITECTURE_EVIDENCE.md')
          text = evidence.read_text()
          old = '[`gemm_dispatcher.cu`](../src/backend/cuda/runtime/gemm_dispatcher.cu)'
          new = '[`gemm_dispatcher.cpp`](../src/backend/cuda/runtime/gemm_dispatcher.cpp)'
          if old not in text:
              raise SystemExit('expected stale architecture link not found')
          evidence.write_text(text.replace(old, new))

          kernels = Path('include/celeg/backend/cuda/kernels/gemv_kernels.cuh')
          text = kernels.read_text()
          old = 'src/backend/cuda/runtime/gemm_dispatcher.cu  (BF16 decode GEMV)'
          new = 'src/backend/cuda/kernels/transform.cu       (BF16 decode GEMV)'
          if old not in text:
              raise SystemExit('expected stale GEMV ownership comment not found')
          kernels.write_text(text.replace(old, new))
          PY
          rm .github/workflows/finalize-refactor.yml
          python3 scripts/check_architecture_boundaries.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh source references after CUDA split"
          git push origin HEAD:refactor-clean-semantics-final
