name: Lizzy real checkpoint validation

"on":
  push:
    branches:
      - lizzy-real-validation
    paths-ignore:
      - artifacts/lizzy-harness/**

permissions:
  contents: write

concurrency:
  group: lizzy-real-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      MODEL_DIR: /tmp/lizzy-7b
      RESULT_DIR: artifacts/lizzy-harness
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Install reference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers accelerate safetensors huggingface_hub

      - name: Build CELEG CPU validation tools
        shell: bash
        run: |
          mkdir -p "$RESULT_DIR"
          set +e
          python scripts/dev.py build --backend cpu --build-type Release --jobs 2 \
            >"$RESULT_DIR/build.stdout.log" 2>"$RESULT_DIR/build.stderr.log"
          status=$?
          echo "$status" >"$RESULT_DIR/build.status"
          exit 0

      - name: Download exact Lizzy checkpoint
        shell: bash
        run: |
          mkdir -p "$RESULT_DIR"
          if [ "$(cat "$RESULT_DIR/build.status")" != "0" ]; then
            echo 125 >"$RESULT_DIR/download.status"
            exit 0
          fi
          set +e
          python - <<'PY' >"$RESULT_DIR/download.stdout.log" 2>"$RESULT_DIR/download.stderr.log"
          from huggingface_hub import snapshot_download
          path = snapshot_download(
              repo_id="flwrlabs/Lizzy-7B",
              local_dir="/tmp/lizzy-7b",
          )
          print(path)
          PY
          status=$?
          echo "$status" >"$RESULT_DIR/download.status"
          exit 0

      - name: Resolve real checkpoint with CELEG
        shell: bash
        run: |
          if [ "$(cat "$RESULT_DIR/download.status")" != "0" ]; then
            echo 125 >"$RESULT_DIR/resolve.status"
            exit 0
          fi
          set +e
          out/linux-cpu-release/celeg-cpu-run \
            --model "$MODEL_DIR" --print-config --context 128 \
            >"$RESULT_DIR/resolve.stdout.log" 2>"$RESULT_DIR/resolve.stderr.log"
          status=$?
          echo "$status" >"$RESULT_DIR/resolve.status"
          exit 0

      - name: Export Transformers golden logits and tokens
        shell: bash
        run: |
          if [ "$(cat "$RESULT_DIR/resolve.status")" != "0" ]; then
            echo 125 >"$RESULT_DIR/reference.status"
            exit 0
          fi
          set +e
          python scripts/export_cpu_reference.py \
            --model "$MODEL_DIR" \
            --prompt "The capital of France is" \
            --output /tmp/lizzy-reference \
            --raw \
            --dtype bfloat16 \
            --generate-tokens 8 \
            >"$RESULT_DIR/reference.stdout.log" 2>"$RESULT_DIR/reference.stderr.log"
          status=$?
          echo "$status" >"$RESULT_DIR/reference.status"
          if [ -f /tmp/lizzy-reference/metadata.json ]; then
            cp /tmp/lizzy-reference/metadata.json "$RESULT_DIR/reference.metadata.json"
          fi
          exit 0

      - name: Compare CELEG against Transformers
        shell: bash
        run: |
          if [ "$(cat "$RESULT_DIR/reference.status")" != "0" ]; then
            echo 125 >"$RESULT_DIR/compare.status"
            exit 0
          fi
          set +e
          out/linux-cpu-release/celeg-cpu-compare-reference \
            "$MODEL_DIR" /tmp/lizzy-reference bf16 scalar 2 \
            >"$RESULT_DIR/compare.stdout.log" 2>"$RESULT_DIR/compare.stderr.log"
          status=$?
          echo "$status" >"$RESULT_DIR/compare.status"
          exit 0

      - name: Write validation summary
        if: always()
        shell: bash
        run: |
          mkdir -p "$RESULT_DIR"
          value() {
            if [ -f "$RESULT_DIR/$1.status" ]; then cat "$RESULT_DIR/$1.status"; else echo 126; fi
          }
          build=$(value build)
          download=$(value download)
          resolve=$(value resolve)
          reference=$(value reference)
          compare=$(value compare)
          {
            echo "# Lizzy real checkpoint validation"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- model: flwrlabs/Lizzy-7B"
            echo "- build: $build"
            echo "- download: $download"
            echo "- CELEG semantic resolution: $resolve"
            echo "- Transformers reference: $reference"
            echo "- logits/token comparison: $compare"
            echo
            for stage in build download resolve reference compare; do
              if [ -f "$RESULT_DIR/$stage.stderr.log" ] && [ -s "$RESULT_DIR/$stage.stderr.log" ]; then
                echo "## $stage stderr"
                echo '```text'
                tail -300 "$RESULT_DIR/$stage.stderr.log"
                echo '```'
                echo
              fi
              if [ -f "$RESULT_DIR/$stage.stdout.log" ] && [ -s "$RESULT_DIR/$stage.stdout.log" ]; then
                echo "## $stage stdout"
                echo '```text'
                tail -300 "$RESULT_DIR/$stage.stdout.log"
                echo '```'
                echo
              fi
            done
          } >"$RESULT_DIR/summary.md"

      - name: Persist validation result on branch
        if: always()
        shell: bash
        run: |
          git config user.name "celeg-validation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f "$RESULT_DIR"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: record Lizzy real validation result"
          git push origin HEAD:lizzy-real-validation

      - name: Enforce validation result
        if: always()
        shell: bash
        run: |
          for stage in build download resolve reference compare; do
            status=126
            if [ -f "$RESULT_DIR/$stage.status" ]; then status=$(cat "$RESULT_DIR/$stage.status"); fi
            if [ "$status" != "0" ]; then
              echo "$stage failed with status $status" >&2
              exit 1
            fi
          done
