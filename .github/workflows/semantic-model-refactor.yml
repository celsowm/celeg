name: Semantic model refactor runner

"on":
  push:
    branches:
      - agent/automatic-semantic-model-support
    paths:
      - scripts/apply_semantic_model_refactor_phase8.py
      - scripts/apply_semantic_model_refactor_phase9.py
      - .github/workflows/semantic-model-refactor.yml

concurrency:
  group: semantic-model-refactor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automatic-semantic-model-support
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply regression coverage
        run: |
          python scripts/apply_semantic_model_refactor_phase8.py
          python scripts/apply_semantic_model_refactor_phase9.py
      - name: Publish coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "test: cover automatic semantic model support"
          git push origin HEAD:agent/automatic-semantic-model-support
