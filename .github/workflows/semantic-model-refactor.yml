name: Semantic model verification

"on":
  push:
    branches:
      - agent/automatic-semantic-model-support
    paths:
      - .github/workflows/semantic-model-refactor.yml

concurrency:
  group: semantic-model-verification
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - run: echo "stale semantic verification cancelled; Linux smoke is authoritative for this revision"
