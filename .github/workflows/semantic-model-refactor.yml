name: Semantic model refactor runner

"on":
  push:
    branches:
      - agent/automatic-semantic-model-support
    paths:
      - scripts/apply_semantic_model_refactor_phase3.py
      - scripts/apply_semantic_model_refactor_phase4.py
      - scripts/apply_semantic_model_refactor_phase5.py
      - scripts/apply_semantic_model_refactor_phase6.py
      - scripts/apply_semantic_model_refactor_phase7.py
      - .github/workflows/semantic-model-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automatic-semantic-model-support
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libcurl4-openssl-dev
      - name: Apply semantic cleanup
        run: |
          python scripts/apply_semantic_model_refactor_phase3.py
          python scripts/apply_semantic_model_refactor_phase4.py
          python scripts/apply_semantic_model_refactor_phase5.py
          python scripts/apply_semantic_model_refactor_phase6.py
          python scripts/apply_semantic_model_refactor_phase7.py
      - name: Verify CPU
        run: |
          set +e
          python scripts/dev.py verify --backend cpu --build-type Release --jobs 2 > semantic-refactor-build-full.txt 2>&1
          status=$?
          tail -n 600 semantic-refactor-build-full.txt > semantic-refactor-build.txt
          printf '\nVERIFY_EXIT_CODE=%s\n' "$status" >> semantic-refactor-build.txt
          rm semantic-refactor-build-full.txt
          exit 0
      - name: Commit generated refactor and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f semantic-refactor-build.txt
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: implement automatic semantic model support"
          git push origin HEAD:agent/automatic-semantic-model-support
