name: Semantic model patch runner

"on":
  push:
    branches:
      - agent/automatic-semantic-model-support
    paths:
      - scripts/fix_packed_rmsnorm.py
      - .github/workflows/semantic-model-refactor.yml

permissions:
  contents: write

concurrency:
  group: semantic-model-patch
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automatic-semantic-model-support
      - name: Apply packed RMSNorm fix
        run: python3 scripts/fix_packed_rmsnorm.py
      - name: Publish source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/cpu/packed/execution.cpp
          git commit -m "fix(cpu): preserve per-slot RMSNorm epsilon"
          git push origin HEAD:agent/automatic-semantic-model-support
