name: Apple Metal build

"on":
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-metal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade cmake ninja
      - name: Diagnose
        run: python scripts/dev.py doctor --backend metal --json > doctor-macos-metal.json
      - name: Compile Metal shaders
        run: |
          xcrun --sdk macosx metal -c src/backend/metal/kernels/probe.metal -o probe.air
          xcrun --sdk macosx metal -c src/backend/metal/kernels/inference.metal -o inference.air
          xcrun --sdk macosx metallib probe.air inference.air -o celeg.metallib
      - name: Compile complete TensorOps shader when SDK supports it
        run: |
          cat > tensorops-probe.metal <<'EOF'
          #include <metal_stdlib>
          #include <metal_tensor>
          using namespace metal;
          EOF
          if xcrun --sdk macosx metal -c tensorops-probe.metal -o tensorops-probe.air >/dev/null 2>&1; then
            cat src/backend/metal/kernels/tensor.metal \
                src/backend/metal/kernels/tensor_q4k_static_stage128.metal \
                src/backend/metal/kernels/tensor_q4k_relaxed.metal \
                src/backend/metal/kernels/tensor_dense_relaxed.metal \
                apps/benchmark/metal/tensor_dense_64x256.metal \
                apps/benchmark/metal/tensor_dense_k32.metal \
                apps/benchmark/metal/tensor_dense_stage16.metal \
                > tensor-complete.metal
            xcrun --sdk macosx metal -c tensor-complete.metal -o tensor-complete.air
          else
            echo "SKIP: hosted macOS SDK does not provide <metal_tensor>"
          fi
      - name: Compile materialized simdgroup attention shader
        run: |
          cat src/backend/metal/kernels/inference/common.metal \
              src/backend/metal/kernels/inference/attention_one_exp.metal \
              apps/benchmark/metal/attention_materialized_simdgroup.metal \
              > materialized-attention.metal
          xcrun --sdk macosx metal -c materialized-attention.metal -o materialized-attention.air
      - name: Compile tiled simdgroup attention shader
        run: |
          cat src/backend/metal/kernels/inference/common.metal \
              src/backend/metal/kernels/inference/attention_one_exp.metal \
              src/backend/metal/kernels/inference/attention_tiled_simdgroup.metal \
              > tiled-attention.metal
          xcrun --sdk macosx metal -c tiled-attention.metal -o tiled-attention.air
      - name: Compile prefill tail candidate shader
        run: xcrun --sdk macosx metal -c apps/benchmark/metal/prefill_tail_fast.metal -o prefill-tail.air
      - name: Compile dense matvec vector candidate shader
        run: xcrun --sdk macosx metal -c apps/benchmark/metal/dense_matvec_vector.metal -o dense-matvec-vector.air
      - name: Compile 64x256 tensor tile harness
        run: python scripts/metal_tile_64x256.py --build-only
      - name: Compile dense 64x256 tensor harness
        run: python scripts/metal_dense_64x256.py --build-only
      - name: Compile dense K32 tensor harness
        run: python scripts/metal_dense_k32.py --build-only
      - name: Compile dense stage16 tensor harness
        run: python scripts/metal_dense_stage16.py --build-only
      - name: Compile dense matvec vector harness
        run: python scripts/metal_dense_matvec_vector.py --build-only
      - name: Compile relaxed-precision tensor harness
        run: python scripts/metal_relaxed_precision.py --build-only
      - name: Compile relaxed Q4_K N32 harness
        run: python scripts/metal_q4k_relaxed_n32.py --build-only
      - name: Compile K32 Q4_K tensor harness
        run: python scripts/metal_q4k_k32.py --build-only
      - name: Compile strict llama-style K32 Q4_K tensor harness
        run: python scripts/metal_q4k_k32_llama_strict.py --build-only
      - name: Compile relaxed llama-style K32 Q4_K tensor harness
        run: python scripts/metal_q4k_k32_llama_relaxed.py --build-only
      - name: Compile stage128 Q4_K tensor harness
        run: python scripts/metal_q4k_stage128.py --build-only
      - name: Compile static-full Q4_K tensor harness
        run: python scripts/metal_q4k_static_full.py --build-only
      - name: Compile static-stage128 Q4_K tensor harness
        run: python scripts/metal_q4k_static_stage128.py --build-only
      - name: Compile strided static-stage128 Q4_K harness
        run: python scripts/metal_q4k_static_stage128_strided.py --build-only
      - name: Compile vectorized K32 Q4_K tensor harness
        run: python scripts/metal_q4k_k32_vector.py --build-only
      - name: Compile vectorized K64 Q4_K tensor harness
        run: python scripts/metal_q4k_k64_vector.py --build-only
      - name: Compile predecoded Q4_K tensor harness
        run: python scripts/metal_q4k_predecoded.py --build-only
      - name: Compile parallel shortconv harness
        run: python scripts/metal_shortconv_batch_parallel.py --build-only
      - name: Compile one-exp attention harness
        run: python scripts/metal_attention_one_exp.py --build-only
      - name: Compile materialized simdgroup attention harness
        run: python scripts/metal_attention_materialized_simdgroup.py --build-only
      - name: Compile tiled simdgroup attention harness
        run: python scripts/metal_attention_tiled_simdgroup.py --build-only
      - name: Check Metal benchmark runners
        run: python -m py_compile benchmarks/compare_metal.py scripts/metal_prefill_storage_profile.py scripts/metal_prefill_gpu_profile.py scripts/metal_q4k_relaxed_n32.py scripts/metal_prefill_policy_compare.py scripts/metal_prefill_next_relaxed.py scripts/metal_rope_table.py scripts/metal_prefill_tail.py scripts/metal_counter_capabilities.py scripts/metal_attention_one_exp.py scripts/metal_attention_materialized_simdgroup.py scripts/metal_attention_tiled_simdgroup.py scripts/metal_shortconv_batch_parallel.py scripts/metal_q4k_k32_llama_relaxed.py scripts/metal_dense_64x256.py scripts/metal_dense_k32.py scripts/metal_dense_stage16.py scripts/metal_dense_stage16_sharedmem.py scripts/metal_dense_stage16_promotion.py scripts/metal_decode_gpu_profile.py scripts/metal_dense_matvec_vector.py
      - name: Build Metal backend and test targets
        run: python scripts/dev.py build --backend metal --celeg-tests off --build-type Release --jobs 2
      - name: Compile fused RoPE table harness
        run: python scripts/metal_rope_table.py --no-build --build-only
      - name: Compile prefill tail harness
        run: python scripts/metal_prefill_tail.py --no-build --build-only
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-macos-metal
          path: doctor-macos-metal.json
          if-no-files-found: ignore
