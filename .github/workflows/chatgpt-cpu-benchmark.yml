name: ChatGPT CPU benchmark

on:
  push:
    branches: [chatgpt-cpu-bench-20260727]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_XET: "1"
      LFM_REVISION: 37b30cce3446f3f2e26a0d3f8c67c9167f5079d7
      LLAMA_REVISION: 0e4a0362239713ea95a6864a17a8de4b0ad90d62
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build numactl
          python -m pip install --upgrade pip huggingface_hub
      - name: Run quick comparative CPU benchmark
        run: bash benchmarks/chatgpt_temp_cpu_bench_quick.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-benchmark-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: error
          retention-days: 7
